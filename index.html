<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쉰소리 정책 안내</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FFFDF8;
    --fg: #1A1A1A;
    --sub: #55524A;
    --line: #E5E0D3;
    --accent: #B23B2E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17150F;
      --fg: #F2EFE6;
      --sub: #B8B3A4;
      --line: #33301F;
      --accent: #E08066;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 60px 20px 80px;
  }
  h1 {
    font-size: 27px;
    line-height: 1.4;
    margin: 0 0 12px;
  }
  .lead {
    color: var(--sub);
    font-size: 16px;
    margin: 0 0 40px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    background: rgba(0,0,0,0.02);
  }
  @media (prefers-color-scheme: dark) {
    .card { background: rgba(255,255,255,0.03); }
  }
  .card h2 {
    font-size: 18px;
    margin: 0 0 6px;
    color: var(--accent);
  }
  .card p {
    font-size: 15px;
    color: var(--sub);
    margin: 0;
  }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--sub);
  }
  a.contact { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>쉰소리 정책 안내</h1>
  <p class="lead">쉰소리 앱과 관련된 개인정보처리방침, 모더레이션(콘텐츠 관리) 정책을 안내합니다.</p>

  <a class="card" href="./privacy.html">
    <h2>개인정보처리방침</h2>
    <p>어떤 정보를 모으고 모으지 않는지, 어떻게 보관하고 지우는지 안내합니다.</p>
  </a>

  <a class="card" href="./moderation.html">
    <h2>모더레이션 정책</h2>
    <p>이용자가 올린 글을 어떻게 검수하고, 신고와 차단은 어떻게 처리하는지 안내합니다.</p>
  </a>

  <footer>
    문의: <a class="contact" href="mailto:juicynj@gmail.com">juicynj@gmail.com</a>
  </footer>
</main>
</body>
</html>
